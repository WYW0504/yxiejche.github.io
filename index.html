<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多后缀二维码生成器</title>
    <!-- 引入 qrcode.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 380px; /* 稍微加宽以适应选项卡 */
        }

        h2 { color: #333; margin-bottom: 20px; font-size: 1.5rem; }

        #qrcode {
            display: flex; justify-content: center; margin-bottom: 20px;
            padding: 10px; background: #fff; border: 1px solid #eee; border-radius: 8px;
        }
        #qrcode img { display: block; }

        /* --- 选项卡样式 --- */
        .tabs-container { margin-bottom: 15px; }
        .tabs-nav {
            display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px;
            margin-bottom: 10px; scrollbar-width: none; /* 隐藏滚动条 */
        }
        .tabs-nav::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            padding: 6px 12px; border: 1px solid #ddd; border-radius: 20px;
            background: #f9f9f9; cursor: pointer; font-size: 12px; white-space: nowrap;
            transition: all 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .tab-btn.active { background: #007BFF; color: white; border-color: #007BFF; }
        .tab-btn:hover:not(.active) { background: #eee; }
        
        .tab-close {
            font-size: 14px; line-height: 1; cursor: pointer; opacity: 0.7;
        }
        .tab-close:hover { opacity: 1; color: #ff4d4f; }

        .add-tab-btn {
            padding: 6px 10px; border: 1px dashed #ccc; border-radius: 20px;
            background: transparent; cursor: pointer; font-size: 12px; color: #888;
        }
        .add-tab-btn:hover { border-color: #007BFF; color: #007BFF; }

        /* 后缀输入框 */
        .suffix-input {
            width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 13px; outline: none; box-sizing: border-box; margin-bottom: 10px;
        }
        .suffix-input:focus { border-color: #007BFF; }

        /* 主链接输入框 */
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        input[type="text"].main-input {
            padding: 12px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 16px; outline: none; transition: border-color 0.3s;
        }
        input[type="text"].main-input:focus { border-color: #007BFF; }

        .hint { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>

<body>
    <div class="container">
        <h2>二维码生成器</h2>
        <div id="qrcode"></div>

        <!-- 选项卡区域 -->
        <div class="tabs-container">
            <div id="tabsNav" class="tabs-nav"></div>
            <input type="text" id="suffixInput" class="suffix-input" placeholder="在此输入当前选项卡的后缀参数...">
        </div>

        <!-- 主链接输入 -->
        <div class="input-group">
            <input type="text" id="urlInput" class="main-input" placeholder="在此输入基础网址..." autocomplete="off">
            <p class="hint">输入网址或切换选项卡后自动刷新二维码</p>
        </div>
    </div>

    <script>
        // --- 核心状态管理 ---
        let tabs = [
            { id: 1, name: "默认参数", suffix: "?adid=111&os=0&csite=1&ip=1.8.6.6&cid=17&clickid=55&callback=23&creativeid=1212&creativetype=3&projectid=1212&promotionid=1212" },
            { id: 2, name: "测试环境", suffix: "?resp-content-type=text%2Fhtml&adid=111&os=0&csite=1&i=1.8.6.6&cid=17&clickid=55&callback=23&creativeid=1212&creativetype=3&projectid=1212&promotionid=1212" }
        ];
        let activeTabId = 1;
        let nextId = 3; // 用于生成新的唯一ID

        // --- DOM 元素 ---
        const qrContainer = document.getElementById("qrcode");
        const urlInput = document.getElementById("urlInput");
        const suffixInput = document.getElementById("suffixInput");
        const tabsNav = document.getElementById("tabsNav");

        // --- 渲染选项卡 ---
        function renderTabs() {
            tabsNav.innerHTML = '';
            tabs.forEach(tab => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${tab.id === activeTabId ? 'active' : ''}`;
                btn.innerHTML = `
                    <span class="tab-name">${tab.name}</span>
                    <span class="tab-close" data-id="${tab.id}">&times;</span>
                `;
                // 点击切换
                btn.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('tab-close')) switchTab(tab.id);
                });
                tabsNav.appendChild(btn);
            });

            // 添加新选项卡按钮
            const addBtn = document.createElement('button');
            addBtn.className = 'add-tab-btn';
            addBtn.textContent = '+ 新增';
            addBtn.onclick = addTab;
            tabsNav.appendChild(addBtn);

            // 绑定删除事件
            document.querySelectorAll('.tab-close').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    deleteTab(parseInt(btn.dataset.id));
                };
            });

            updateSuffixInput();
        }

        // --- 选项卡操作逻辑 ---
        function switchTab(id) {
            // 保存当前正在编辑的后缀
            saveCurrentSuffix();
            activeTabId = id;
            renderTabs();
            generateQR();
        }

        function addTab() {
            saveCurrentSuffix(); // 保存旧数据
            const newTab = { id: nextId++, name: `参数 ${nextId - 1}`, suffix: "" };
            tabs.push(newTab);
            activeTabId = newTab.id;
            renderTabs();
            suffixInput.focus(); // 自动聚焦到后缀输入框方便编辑
        }

        function deleteTab(id) {
            if (tabs.length <= 1) return alert("至少保留一个选项卡！");
            tabs = tabs.filter(t => t.id !== id);
            if (activeTabId === id) activeTabId = tabs[0].id;
            renderTabs();
            generateQR();
        }

        function saveCurrentSuffix() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            if (currentTab) currentTab.suffix = suffixInput.value;
        }

        function updateSuffixInput() {
            const currentTab = tabs.find(t => t.id === activeTabId);
            suffixInput.value = currentTab ? currentTab.suffix : "";
        }

        // --- 二维码生成逻辑 ---
        function generateQR() {
            saveCurrentSuffix(); // 确保最新输入被保存
            let inputVal = urlInput.value.trim();
            if (!inputVal) inputVal = "https://www.example.com";

            const currentTab = tabs.find(t => t.id === activeTabId);
            const finalUrl = inputVal + (currentTab ? currentTab.suffix : "");

            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: finalUrl, width: 200, height: 200,
                colorDark: "#000000", colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // --- 事件监听 ---
        urlInput.addEventListener("input", generateQR);
        suffixInput.addEventListener("input", generateQR); // 修改后缀也实时刷新
        window.onload = () => { renderTabs(); generateQR(); };
    </script>
</body>
</html>
